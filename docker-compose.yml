version: "3.9"

services:
  server:
    build:
      context: ./server/newproject
      dockerfile: Dockerfile # Because it's already inside newproject
    volumes:
      - ./server/newproject:/app
    ports:
      - "8000:8000"

  client:
    build:
      context: ./client/app
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./client/app:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
